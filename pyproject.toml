[project]
name = "tg-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gregory", email = "k3r0sense@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "aiohttp>=3.14.5",
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.1",
    "langchain-openai>=1.7.4",
    "markdown-it-py>=4.2.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
tg-ai = "tg_ai:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
